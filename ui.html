<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>AccessibilityCheck</title>
  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
      color: #222;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .settings-anchor {
      position: relative;
    }

    button {
      border: 1px solid #ccc;
      background: white;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button:hover {
      background: #f5f5f5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .icon-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      color: #666;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      line-height: 1;
    }

    .icon-button:hover {
      background: #f3f3f3;
      color: #222;
    }

    .icon-button:focus-visible {
      outline: 2px solid #bcd3ff;
      outline-offset: 2px;
    }

    .settings-popup {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 210px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
      padding: 10px;
      z-index: 20;
    }

    .settings-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .settings-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 2px;
      cursor: pointer;
    }

    .settings-option input {
      margin: 0;
    }

    .settings-divider {
      height: 1px;
      background: #eee;
      margin: 10px 0;
    }

    .settings-reset-btn {
      width: 100%;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .panel {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    .issue {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .issue:hover {
      background: #fafafa;
      border-color: #ddd;
    }

    .issue:focus-visible {
      outline: 2px solid #bcd3ff;
      outline-offset: 2px;
    }

    .issue-select-hint {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      color: #666;
    }

    .muted {
      color: #666;
    }

    .severity {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #ddd;
      margin-top: 4px;
    }

    .status {
      margin-top: 8px;
      color: #444;
    }

    .error {
      color: #b00020;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    .issue-actions-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .issue-actions {
      display: flex;
      gap: 8px;
    }

    .issue-details {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafafa;
      border: 1px solid #eee;
      padding: 8px;
      border-radius: 6px;
      max-height: 180px;
      overflow: auto;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>AI Accessibility Checker</h1>

    <div class="settings-anchor">
      <button id="settings-button" class="icon-button" title="Settings" aria-label="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.2.78.31 1.2.31H21a2 2 0 1 1 0 4h-.09c-.42 0-.84.11-1.2.31z">
          </path>
        </svg>
      </button>

      <div id="settings-panel" class="settings-popup hidden">
        <div class="settings-title">Explanation Mode</div>

        <label class="settings-option">
          <input type="radio" name="demand-mode" value="always" />
          <span>Always</span>
        </label>

        <label class="settings-option">
          <input type="radio" name="demand-mode" value="on_demand" />
          <span>On-demand</span>
        </label>

        <div class="settings-divider"></div>

        <button id="resetDismissedBtn" class="settings-reset-btn" type="button">
          Reset dismissed issues
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <button id="checkBtn">Check for Issues</button>
    <button id="closeBtn">Close</button>
  </div>

  <div id="status" class="status muted"></div>
  <div id="error" class="error"></div>

  <div class="panel">
    <strong>Session</strong>
    <div id="sessionId" class="muted"></div>
  </div>

  <div class="panel">
    <strong>Selection Summary</strong>
    <div id="selectionSummary" class="muted">No selection loaded yet.</div>
  </div>

  <div class="panel">
    <strong>Extracted Data</strong>
    <pre id="selectionData">Waiting for data...</pre>
  </div>

  <div class="panel">
    <strong>Check Results</strong>
    <div id="results" class="muted">No checks run yet.</div>
  </div>

  <script>
    let sessionStarted = false;
    const condition = Math.random() < 0.5 ? "on_demand" : "always_visible";

    const selectionSummary = document.getElementById("selectionSummary");
    const selectionData = document.getElementById("selectionData");
    const results = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const sessionIdEl = document.getElementById("sessionId");
    const checkBtn = document.getElementById("checkBtn");
    const closeBtn = document.getElementById("closeBtn");
    const settingsButton = document.getElementById("settings-button");
    const settingsPanel = document.getElementById("settings-panel");
    const resetDismissedBtn = document.getElementById("resetDismissedBtn");
    const modeInputs = document.querySelectorAll('input[name="demand-mode"]');

    function createId(prefix) {
      return prefix + "-" + Date.now() + "-" + Math.floor(Math.random() * 1000000);
    }

    let userId = "loading-user";
    const sessionId = createId("session");
    let latestResults = null;
    let latestSelectionData = null;
    let isLoading = false;
    let currentDemandMode = "on_demand";

    function updateSessionLabel() {
      sessionIdEl.textContent =
        `User: ${userId} | Session: ${sessionId} | Condition: ${condition} | Mode: ${currentDemandMode}`;
    }

    function postLogEvent(event) {
      parent.postMessage(
        {
          pluginMessage: {
            type: "log-event",
            sessionId,
            userId,
            condition,
            event,
          },
        },
        "*"
      );
    }

    function sendSelectIssueNode(issue, issueIndex) {
      if (!issue?.node_id) return;

      parent.postMessage(
        {
          pluginMessage: {
            type: "select-issue-node",
            nodeId: issue.node_id,
          },
        },
        "*"
      );

      postLogEvent({
        eventType: "issue_card_selected_node",
        demandMode: currentDemandMode,
        issueIndex,
        issueTitle: issue?.title || "",
        issueNode: issue?.node_name || "",
        issueType: issue?.issue_type || "",
        nodeId: issue?.node_id || "",
        severity: issue?.severity || "",
        timestamp: new Date().toISOString(),
      });
    }

    function setLoading(loading) {
      isLoading = loading;

      if (loading) {
        checkBtn.disabled = true;
        checkBtn.innerHTML = `<span class="spinner"></span>Checking...`;
      } else {
        checkBtn.disabled = false;
        checkBtn.innerHTML = "Check for Issues";
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function syncModeInputs() {
      modeInputs.forEach((input) => {
        input.checked = input.value === currentDemandMode;
      });
    }

    function getNodeById(nodeId) {
      const nodes = latestSelectionData?.nodes || [];
      return nodes.find((node) => node.id === nodeId) || null;
    }

    function attachIssueCardHandlers() {
      const cards = document.querySelectorAll(".issue");

      cards.forEach((card) => {
        card.onclick = (event) => {
          const target = event.target;

          if (
            target instanceof HTMLElement &&
            target.closest("button")
          ) {
            return;
          }

          const issueIndex = Number(card.dataset.issueIndex);
          const issue = latestResults?.issues?.[issueIndex];
          sendSelectIssueNode(issue, issueIndex);
        };

        card.onkeydown = (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;

          const target = event.target;
          if (
            target instanceof HTMLElement &&
            target.closest("button")
          ) {
            return;
          }

          event.preventDefault();

          const issueIndex = Number(card.dataset.issueIndex);
          const issue = latestResults?.issues?.[issueIndex];
          sendSelectIssueNode(issue, issueIndex);
        };
      });
    }

    function renderResults(payload) {
      if (!payload) return;

      latestResults = payload;

      const issues = payload.issues || [];
      const summary = payload.summary || {};
      const overall = payload.overall_assessment || "";

      if (!issues.length) {
        results.innerHTML = `
          <div>No issues returned.</div>
          <div class="muted">${escapeHtml(overall)}</div>
        `;
        return;
      }

      results.innerHTML = `
        <div class="muted">
          Total nodes: ${summary.total_nodes ?? "?"}<br>
          Text nodes: ${summary.text_nodes ?? "?"}<br>
          Issues found: ${issues.length}
        </div>
        ${overall ? `<p><strong>Overall:</strong> ${escapeHtml(overall)}</p>` : ""}
        ${issues.map((issue, index) => `
          <div class="issue" data-issue-index="${index}" tabindex="0" role="button" aria-label="Select ${escapeHtml(issue.node_name || "node")} in Figma">
            <strong>${escapeHtml(issue.title || "Untitled issue")}</strong><br>
            <span class="muted">Node: ${escapeHtml(issue.node_name || "Unknown")}</span><br>
            <span class="issue-select-hint">Click card to select layer in Figma</span><br>
            <span class="severity">${escapeHtml(issue.severity || "unknown")}</span>

            <div class="issue-actions-row">
              <div class="issue-actions explanation-actions ${currentDemandMode === "always" ? "hidden" : ""}">
                <button class="toggle-explanation-btn" type="button" data-issue-index="${index}">
                  Show Explanation
                </button>
              </div>

              <div class="issue-actions">
                <button class="dismiss-issue-btn" type="button" data-issue-index="${index}">
                  Dismiss Issue
                </button>
              </div>
            </div>

            <div class="issue-details ${currentDemandMode === "always" ? "" : "hidden"}" id="issue-details-${index}">
              <p>${escapeHtml(issue.explanation || "")}</p>
              <p><strong>Why it matters:</strong> ${escapeHtml(issue.why_it_matters || "")}</p>
              <p><strong>Suggestion:</strong> ${escapeHtml(issue.suggestion || "")}</p>
            </div>
          </div>
        `).join("")}
      `;

      attachExplanationHandlers();
      attachDismissHandlers();
      attachIssueCardHandlers();
    }

    function attachExplanationHandlers() {
      const buttons = document.querySelectorAll(".toggle-explanation-btn");

      buttons.forEach((button) => {
        button.onclick = (event) => {
          event.stopPropagation();

          const issueIndex = Number(button.dataset.issueIndex);
          const details = document.getElementById(`issue-details-${issueIndex}`);
          if (!details) return;

          const issue = latestResults?.issues?.[issueIndex];
          const isHidden = details.classList.contains("hidden");

          if (isHidden) {
            details.classList.remove("hidden");
            button.textContent = "Hide Explanation";

            postLogEvent({
              eventType: "show_explanation",
              demandMode: currentDemandMode,
              issueIndex,
              issueTitle: issue?.title || "",
              issueNode: issue?.node_name || "",
              issueType: issue?.issue_type || "",
              nodeId: issue?.node_id || "",
              severity: issue?.severity || "",
              totalIssues: latestResults?.issues?.length || 0,
              timestamp: new Date().toISOString(),
            });
          } else {
            details.classList.add("hidden");
            button.textContent = "Show Explanation";

            postLogEvent({
              eventType: "hide_explanation",
              demandMode: currentDemandMode,
              issueIndex,
              issueTitle: issue?.title || "",
              issueNode: issue?.node_name || "",
              issueType: issue?.issue_type || "",
              nodeId: issue?.node_id || "",
              severity: issue?.severity || "",
              totalIssues: latestResults?.issues?.length || 0,
              timestamp: new Date().toISOString(),
            });
          }
        };

        button.onkeydown = (event) => {
          event.stopPropagation();
        };
      });
    }

    function attachDismissHandlers() {
      const buttons = document.querySelectorAll(".dismiss-issue-btn");

      buttons.forEach((button) => {
        button.onclick = (event) => {
          event.stopPropagation();

          const issueIndex = Number(button.dataset.issueIndex);
          const issue = latestResults?.issues?.[issueIndex];
          if (!issue) return;

          const node = getNodeById(issue.node_id);

          parent.postMessage(
            {
              pluginMessage: {
                type: "dismiss-issue",
                sessionId,
                userId,
                condition,
                issue: {
                  issue_type: issue.issue_type,
                  node_id: issue.node_id,
                  node_name: issue.node_name,
                },
                nodeFingerprint: node?.fingerprint || null,
              },
            },
            "*"
          );

          button.textContent = "Dismissed ✓";
          button.disabled = true;
        };

        button.onkeydown = (event) => {
          event.stopPropagation();
        };
      });
    }

    function applyDemandModeToInterface() {
      updateSessionLabel();
      updateExplanationVisibilityInPlace();
    }

    function updateExplanationVisibilityInPlace() {
      const detailBlocks = document.querySelectorAll(".issue-details");
      const explanationActionBlocks = document.querySelectorAll(".explanation-actions");
      const toggleButtons = document.querySelectorAll(".toggle-explanation-btn");

      if (currentDemandMode === "always") {
        detailBlocks.forEach((details) => {
          details.classList.remove("hidden");
        });

        explanationActionBlocks.forEach((actions) => {
          actions.classList.add("hidden");
        });
      } else {
        detailBlocks.forEach((details) => {
          details.classList.add("hidden");
        });

        explanationActionBlocks.forEach((actions) => {
          actions.classList.remove("hidden");
        });

        toggleButtons.forEach((button) => {
          button.textContent = "Show Explanation";
        });

        attachExplanationHandlers();
      }
    }

    settingsButton.onclick = (event) => {
      event.stopPropagation();
      syncModeInputs();
      settingsPanel.classList.toggle("hidden");
    };

    settingsPanel.onclick = (event) => {
      event.stopPropagation();
    };

    document.addEventListener("click", () => {
      settingsPanel.classList.add("hidden");
    });

    modeInputs.forEach((input) => {
      input.addEventListener("change", (event) => {
        event.stopPropagation();
        if (!input.checked) return;

        currentDemandMode = input.value;
        syncModeInputs();

        parent.postMessage(
          {
            pluginMessage: {
              type: "set-demand-mode",
              mode: input.value,
              sessionId,
              userId,
              condition,
              reason: "manual_settings_toggle",
            },
          },
          "*"
        );
      });
    });

    resetDismissedBtn.onclick = (event) => {
      event.stopPropagation();

      parent.postMessage(
        {
          pluginMessage: {
            type: "reset-dismissed-issues",
            sessionId,
            userId,
            condition,
          },
        },
        "*"
      );
    };

    checkBtn.onclick = () => {
      if (isLoading) return;

      errorEl.textContent = "";
      statusEl.textContent = "Running GPT accessibility check...";
      setLoading(true);

      postLogEvent({
        eventType: "run_check_click",
        demandMode: currentDemandMode,
        timestamp: new Date().toISOString(),
      });

      parent.postMessage(
        {
          pluginMessage: {
            type: "run-gpt-check",
            sessionId,
            userId,
            condition,
          },
        },
        "*"
      );
    };

    closeBtn.onclick = () => {
      postLogEvent({
        eventType: "session_end",
        demandMode: currentDemandMode,
        timestamp: new Date().toISOString(),
      });

      setTimeout(() => {
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
      }, 100);
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "demand-mode") {
        currentDemandMode = msg.payload.mode;
        syncModeInputs();
        applyDemandModeToInterface();
      }

      if (msg.type === "user-id") {
        userId = msg.payload.userId || "unknown-user";
        updateSessionLabel();

        if (!sessionStarted) {
          sessionStarted = true;

          postLogEvent({
            eventType: "session_start",
            demandMode: currentDemandMode,
            timestamp: new Date().toISOString(),
          });
        }
      }

      if (msg.type === "selection-data") {
        const data = msg.payload;
        latestSelectionData = data;
        selectionSummary.textContent =
          `Selected top-level nodes: ${data.selectionCount}. Extracted nodes: ${data.nodes.length}.`;
        selectionData.textContent = JSON.stringify(data, null, 2);
      }

      if (msg.type === "status") {
        statusEl.textContent = msg.payload.message || "";
      }

      if (msg.type === "check-results") {
        setLoading(false);
        statusEl.textContent = "Check complete.";
        errorEl.textContent = "";
        renderResults(msg.payload);
      }

      if (msg.type === "check-error") {
        setLoading(false);
        statusEl.textContent = "";
        errorEl.textContent = msg.payload.message || "Unknown error";
      }

      if (msg.type === "issue-dismissed") {
        const { issueType, nodeId } = msg.payload;

        if (latestResults && Array.isArray(latestResults.issues)) {
          latestResults.issues = latestResults.issues.filter((issue) => {
            return !(issue.issue_type === issueType && issue.node_id === nodeId);
          });
          renderResults(latestResults);
        }

        statusEl.textContent = "Issue dismissed for this file until that element changes.";
      }

      if (msg.type === "dismissed-issues-reset") {
        statusEl.textContent = "Dismissed issues reset for this file.";
      }
    };

    updateSessionLabel();
  </script>
</body>

</html>
