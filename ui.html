<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>AccessibilityCheck</title>
  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
      color: #222;
      background: #fff;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .settings-anchor {
      position: relative;
    }

    button {
      border: 1px solid #ccc;
      background: white;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #f5f5f5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .icon-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      color: #666;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      line-height: 1;
      position: relative;
      flex-shrink: 0;
    }

    .icon-button:hover {
      background: #f3f3f3;
      color: #222;
    }

    .icon-button:focus-visible {
      outline: 2px solid #bcd3ff;
      outline-offset: 2px;
    }

    .icon-button svg,
    .icon-button span {
      pointer-events: none;
    }

    .settings-popup {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 230px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
      padding: 10px;
      z-index: 20;
    }

    .settings-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .settings-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 2px;
      cursor: pointer;
    }

    .settings-option input {
      margin: 0;
    }

    .settings-divider {
      height: 1px;
      background: #eee;
      margin: 10px 0;
    }

    .settings-reset-btn {
      width: 100%;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .panel {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      background: #fff;
    }

    .muted {
      color: #666;
    }

    .status {
      margin-top: 8px;
      color: #444;
    }

    .error {
      color: #b00020;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    .results-meta {
      margin-bottom: 12px;
    }

    .issue {
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
      background: #fff;
    }

    .issue.issue-expanded {
      border-color: #d9d9d9;
    }

    .issue-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px;
    }

    .issue-expand-btn {
      margin-top: 1px;
      font-size: 14px;
      color: #555;
    }

    .issue-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .issue-title {
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .issue-element {
      color: #666;
      font-size: 12px;
      line-height: 1.35;
    }

    .issue-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .severity {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #ddd;
      margin-top: 6px;
      width: fit-content;
      text-transform: capitalize;
    }

    .severity-high {
      border-color: #f0c6c6;
      background: #fff5f5;
      color: #9f2626;
    }

    .severity-medium {
      border-color: #f1dfb4;
      background: #fffaf0;
      color: #8b6500;
    }

    .severity-low {
      border-color: #d8e8d8;
      background: #f5fff5;
      color: #2f6b2f;
    }

    .issue-body {
      border-top: 1px solid #f1f1f1;
      padding: 10px;
      background: #fcfcfc;
    }

    .issue-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #666;
      margin-bottom: 4px;
    }

    .fix-box,
    .explanation-box {
      border: 1px solid #ececec;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    .fix-box+.explanation-controls,
    .fix-box+.explanation-box,
    .explanation-controls+.explanation-box {
      margin-top: 10px;
    }

    .fix-box {
      position: relative;
      border: 1px solid #ececec;
      border-radius: 8px;
      padding: 12px;
      padding-right: 42px;
      background: #fff;
    }

    .fix-overlay-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
    }

    .issue-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #666;
      margin: 0 0 6px 0;
      line-height: 1.2;
    }

    .explanation-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .explanation-toggle-btn {
      padding: 6px 10px;
      font-size: 12px;
    }

    .questionmark-btn {
      width: 22px;
      height: 22px;
      font-size: 13px;
      border: 1px solid #dcdcdc;
      color: #555;
      background: #fff;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .questionmark-btn:hover {
      background: #f7f7f7;
      color: #222;
    }

    .questionmark-btn:focus-visible {
      outline: 2px solid #bcd3ff;
      outline-offset: 2px;
    }

    .questionmark-btn.attention-nudge {
      animation: pulseNudge 1.1s ease-in-out 2;
      border-color: #c4c4c4;
    }

    @keyframes pulseNudge {
      0% {
        transform: scale(1);
      }

      30% {
        transform: scale(1.18);
      }

      60% {
        transform: scale(0.96);
      }

      100% {
        transform: scale(1);
      }
    }

    .explanation-box p {
      margin: 0 0 8px 0;
      line-height: 1.45;
    }

    .explanation-box p:last-child {
      margin-bottom: 0;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafafa;
      border: 1px solid #eee;
      padding: 8px;
      border-radius: 6px;
      max-height: 180px;
      overflow: auto;
    }

    .tooltip-bubble {
      position: fixed;
      z-index: 9999;
      max-width: 180px;
      background: rgba(34, 34, 34, 0.96);
      color: #fff;
      font-size: 11px;
      line-height: 1.35;
      padding: 6px 8px;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .tooltip-bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>AI Accessibility Checker</h1>

    <div class="settings-anchor">
      <button id="settings-button" class="icon-button" aria-label="Settings" data-tooltip="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.2.78.31 1.2.31H21a2 2 0 1 1 0 4h-.09c-.42 0-.84.11-1.2.31z">
          </path>
        </svg>
      </button>

      <div id="settings-panel" class="settings-popup hidden">
        <div class="settings-title">Explanation Mode</div>

        <label class="settings-option">
          <input type="radio" name="demand-mode" value="on_demand" />
          <span>On-demand</span>
        </label>

        <label class="settings-option">
          <input type="radio" name="demand-mode" value="low_demand" />
          <span>Low-demand</span>
        </label>

        <label class="settings-option">
          <input type="radio" name="demand-mode" value="always_visible" />
          <span>Always-visible</span>
        </label>

        <div class="settings-divider"></div>

        <button id="resetDismissedBtn" class="settings-reset-btn" type="button">
          Reset dismissed issues
        </button>
      </div>
    </div>
  </div>

  <div class="row">
    <button id="checkBtn">Check for Issues</button>
  </div>

  <div id="status" class="status muted"></div>
  <div id="error" class="error"></div>

  <div class="panel">
    <strong>Session</strong>
    <div id="sessionId" class="muted"></div>
  </div>

  <div class="panel">
    <strong>Selection Summary</strong>
    <div id="selectionSummary" class="muted">No selection loaded yet.</div>
  </div>

  <div class="panel">
    <strong>Extracted Data</strong>
    <pre id="selectionData">Waiting for data...</pre>
  </div>

  <div class="panel">
    <strong>Check Results</strong>
    <div id="results" class="muted">No checks run yet.</div>
  </div>

  <div id="tooltipBubble" class="tooltip-bubble" aria-hidden="true"></div>

  <script>
    let sessionStarted = false;
    const condition = "ui_mode_prototype";

    const selectionSummary = document.getElementById("selectionSummary");
    const selectionData = document.getElementById("selectionData");
    const results = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const sessionIdEl = document.getElementById("sessionId");
    const checkBtn = document.getElementById("checkBtn");
    const settingsButton = document.getElementById("settings-button");
    const settingsPanel = document.getElementById("settings-panel");
    const resetDismissedBtn = document.getElementById("resetDismissedBtn");
    const modeInputs = document.querySelectorAll('input[name="demand-mode"]');
    const tooltipBubble = document.getElementById("tooltipBubble");

    function createId(prefix) {
      return prefix + "-" + Date.now() + "-" + Math.floor(Math.random() * 1000000);
    }

    let userId = "loading-user";
    const sessionId = createId("session");
    let latestResults = null;
    let latestSelectionData = null;
    let isLoading = false;
    let currentDemandMode = "on_demand";

    const issueUiState = {};
    let tooltipTimer = null;
    let currentTooltipTarget = null;

    function getIssueKey(issue) {
      return `${issue?.issue_type || "other"}|${issue?.node_id || "unknown-node"}`;
    }

    function ensureIssueState(issue) {
      const key = getIssueKey(issue);
      if (!issueUiState[key]) {
        issueUiState[key] = {
          expanded: false,
          explanationVisible: false,
          visitCount: 0,
          everOpenedExplanation: false,
          nudgeLogged: false
        };
      }
      return issueUiState[key];
    }

    function updateSessionLabel() {
      sessionIdEl.textContent =
        `User: ${userId} | Session: ${sessionId} | Condition: ${condition} | Mode: ${currentDemandMode}`;
    }

    function postLogEvent(event) {
      parent.postMessage(
        {
          pluginMessage: {
            type: "log-event",
            sessionId,
            userId,
            condition,
            event,
          },
        },
        "*"
      );
    }

    function getNodeById(nodeId) {
      const nodes = latestSelectionData?.nodes || [];
      return nodes.find((node) => node.id === nodeId) || null;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function syncModeInputs() {
      modeInputs.forEach((input) => {
        input.checked = input.value === currentDemandMode;
      });
    }

    function setLoading(loading) {
      isLoading = loading;

      if (loading) {
        checkBtn.disabled = true;
        checkBtn.innerHTML = `<span class="spinner"></span>Checking...`;
      } else {
        checkBtn.disabled = false;
        checkBtn.innerHTML = "Check for Issues";
      }
    }

    function severityClass(severity) {
      if (severity === "high") return "severity-high";
      if (severity === "medium") return "severity-medium";
      return "severity-low";
    }

    function renderExplanationContent(issue) {
      return `
        <div class="explanation-box">
          <div class="issue-section-label">Explanation</div>
          <p>${escapeHtml(issue.explanation || "")}</p>
          <p><strong>Why it matters:</strong> ${escapeHtml(issue.why_it_matters || "")}</p>
        </div>
      `;
    }

    function renderExplanationControls(issue, issueIndex, state) {
      if (currentDemandMode === "always_visible") {
        return renderExplanationContent(issue);
      }

      if (currentDemandMode === "on_demand") {
        return `
      <div class="explanation-controls">
        <button
          class="explanation-toggle-btn"
          type="button"
          data-action="toggle-explanation"
          data-issue-index="${issueIndex}">
          ${state.explanationVisible ? "Hide Explanation" : "Show Explanation"}
        </button>
      </div>
      ${state.explanationVisible ? renderExplanationContent(issue) : ""}
    `;
      }

      return state.explanationVisible ? renderExplanationContent(issue) : "";
    }

    function renderResults(payload) {
      if (!payload) return;

      latestResults = payload;

      const issues = payload.issues || [];
      const summary = payload.summary || {};
      const overall = payload.overall_assessment || "";

      if (!issues.length) {
        results.innerHTML = `
          <div>No issues returned.</div>
          <div class="muted">${escapeHtml(overall)}</div>
        `;
        return;
      }

      results.innerHTML = `
        <div class="results-meta muted">
          Total nodes: ${summary.total_nodes ?? "?"}<br>
          Text nodes: ${summary.text_nodes ?? "?"}<br>
          Issues found: ${issues.length}
        </div>
        ${overall ? `<p><strong>Overall:</strong> ${escapeHtml(overall)}</p>` : ""}
        ${issues.map((issue, index) => {
        const state = ensureIssueState(issue);
        const expandedClass = state.expanded ? "issue-expanded" : "";
        const chevron = state.expanded ? "▼" : "▶";

        return `
            <div class="issue ${expandedClass}" data-issue-index="${index}">
              <div class="issue-header">
                <button
                  class="icon-button issue-expand-btn"
                  type="button"
                  data-action="toggle-expand"
                  data-issue-index="${index}"
                  aria-label="${state.expanded ? "Collapse issue" : "Expand issue"}"
                  data-tooltip="${state.expanded ? "Collapse issue" : "Expand issue"}">
                  <span aria-hidden="true">${chevron}</span>
                </button>

                <div class="issue-title-wrap">
                  <div class="issue-title">${escapeHtml(issue.title || "Untitled issue")}</div>
                  <div class="issue-element">Element: ${escapeHtml(issue.node_name || "Unknown")}</div>
                  <div class="severity ${severityClass(issue.severity)}">${escapeHtml(issue.severity || "unknown")}</div>
                </div>

                <div class="issue-header-actions">
                  <button
                    class="icon-button"
                    type="button"
                    data-action="go-to-element"
                    data-issue-index="${index}"
                    aria-label="Go to element"
                    data-tooltip="Go to element">
                    <span aria-hidden="true">↗</span>
                  </button>

                  <button
                    class="icon-button"
                    type="button"
                    data-action="resolve-issue"
                    data-issue-index="${index}"
                    aria-label="Mark as resolved"
                    data-tooltip="Mark as resolved">
                    <span aria-hidden="true">✓</span>
                  </button>
                </div>
              </div>

              ${state.expanded ? `
                <div class="issue-body">
                  <div class="fix-box">
                    ${currentDemandMode === "low_demand" ? `
                      <button
                        class="questionmark-btn fix-overlay-btn ${state.visitCount >= 3 && !state.everOpenedExplanation ? "attention-nudge" : ""}"
                        type="button"
                        data-action="toggle-explanation"
                        data-issue-index="${index}"
                        aria-label="Show explanation"
                        data-tooltip="Show explanation">
                        ?
                      </button>
                    ` : ""}

                    <div class="issue-section-label">How To Fix It</div>
                    <div>${escapeHtml(issue.suggestion || "")}</div>
                  </div>
                  ${renderExplanationControls(issue, index, state)}
                </div>
              ` : ""}
            </div>
          `;
      }).join("")}
      `;

      attachResultsHandlers();
      wireDelayedTooltips(results);
    }

    function logIssueEvent(base) {
      postLogEvent({
        demandMode: currentDemandMode,
        totalIssues: latestResults?.issues?.length || 0,
        timestamp: new Date().toISOString(),
        ...base
      });
    }

    function handleToggleExpand(issueIndex) {
      const issue = latestResults?.issues?.[issueIndex];
      if (!issue) return;

      const state = ensureIssueState(issue);
      state.expanded = !state.expanded;

      if (state.expanded) {
        state.visitCount += 1;

        logIssueEvent({
          eventType: "issue_card_expanded",
          issueIndex,
          issueTitle: issue.title || "",
          issueNode: issue.node_name || "",
          issueType: issue.issue_type || "",
          nodeId: issue.node_id || "",
          severity: issue.severity || "",
          visitCount: state.visitCount
        });

        if (
          currentDemandMode === "low_demand" &&
          state.visitCount >= 3 &&
          !state.everOpenedExplanation &&
          !state.nudgeLogged
        ) {
          state.nudgeLogged = true;

          logIssueEvent({
            eventType: "low_demand_explanation_nudge_triggered",
            issueIndex,
            issueTitle: issue.title || "",
            issueNode: issue.node_name || "",
            issueType: issue.issue_type || "",
            nodeId: issue.node_id || "",
            severity: issue.severity || "",
            visitCount: state.visitCount
          });
        }
      } else {
        logIssueEvent({
          eventType: "issue_card_collapsed",
          issueIndex,
          issueTitle: issue.title || "",
          issueNode: issue.node_name || "",
          issueType: issue.issue_type || "",
          nodeId: issue.node_id || "",
          severity: issue.severity || "",
          visitCount: state.visitCount
        });
      }

      renderResults(latestResults);
    }

    function handleToggleExplanation(issueIndex) {
      const issue = latestResults?.issues?.[issueIndex];
      if (!issue) return;

      const state = ensureIssueState(issue);
      state.explanationVisible = !state.explanationVisible;

      if (state.explanationVisible) {
        state.everOpenedExplanation = true;

        logIssueEvent({
          eventType: "show_explanation",
          issueIndex,
          issueTitle: issue.title || "",
          issueNode: issue.node_name || "",
          issueType: issue.issue_type || "",
          nodeId: issue.node_id || "",
          severity: issue.severity || "",
          visitCount: state.visitCount
        });
      } else {
        logIssueEvent({
          eventType: "hide_explanation",
          issueIndex,
          issueTitle: issue.title || "",
          issueNode: issue.node_name || "",
          issueType: issue.issue_type || "",
          nodeId: issue.node_id || "",
          severity: issue.severity || "",
          visitCount: state.visitCount
        });
      }

      renderResults(latestResults);
    }

    function handleGoToElement(issueIndex) {
      const issue = latestResults?.issues?.[issueIndex];
      if (!issue?.node_id) return;

      parent.postMessage(
        {
          pluginMessage: {
            type: "select-issue-node",
            nodeId: issue.node_id,
          },
        },
        "*"
      );

      logIssueEvent({
        eventType: "go_to_element_clicked",
        issueIndex,
        issueTitle: issue.title || "",
        issueNode: issue.node_name || "",
        issueType: issue.issue_type || "",
        nodeId: issue.node_id || "",
        severity: issue.severity || ""
      });
    }

    function handleResolveIssue(issueIndex) {
      const issue = latestResults?.issues?.[issueIndex];
      if (!issue) return;

      const node = getNodeById(issue.node_id);

      parent.postMessage(
        {
          pluginMessage: {
            type: "dismiss-issue",
            sessionId,
            userId,
            condition,
            issue: {
              issue_type: issue.issue_type,
              node_id: issue.node_id,
              node_name: issue.node_name,
            },
            nodeFingerprint: node?.fingerprint || null,
          },
        },
        "*"
      );

      logIssueEvent({
        eventType: "issue_marked_resolved_clicked",
        issueIndex,
        issueTitle: issue.title || "",
        issueNode: issue.node_name || "",
        issueType: issue.issue_type || "",
        nodeId: issue.node_id || "",
        severity: issue.severity || ""
      });
    }

    function attachResultsHandlers() {
      const actionButtons = results.querySelectorAll("[data-action]");

      actionButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          const issueIndex = Number(button.dataset.issueIndex);
          const action = button.dataset.action;

          if (action === "toggle-expand") {
            handleToggleExpand(issueIndex);
            return;
          }

          if (action === "toggle-explanation") {
            handleToggleExplanation(issueIndex);
            return;
          }

          if (action === "go-to-element") {
            handleGoToElement(issueIndex);
            return;
          }

          if (action === "resolve-issue") {
            handleResolveIssue(issueIndex);
          }
        });
      });
    }

    function showTooltip(target) {
      const text = target.dataset.tooltip;
      if (!text) return;

      tooltipBubble.textContent = text;
      tooltipBubble.classList.remove("hidden");

      const rect = target.getBoundingClientRect();
      const bubbleRect = tooltipBubble.getBoundingClientRect();

      let left = rect.left + rect.width / 2 - bubbleRect.width / 2;
      let top = rect.top - bubbleRect.height - 8;

      if (left < 8) left = 8;
      if (left + bubbleRect.width > window.innerWidth - 8) {
        left = window.innerWidth - bubbleRect.width - 8;
      }

      if (top < 8) {
        top = rect.bottom + 8;
      }

      tooltipBubble.style.left = `${left}px`;
      tooltipBubble.style.top = `${top}px`;
      requestAnimationFrame(() => {
        tooltipBubble.classList.add("visible");
      });
    }

    function hideTooltip() {
      clearTimeout(tooltipTimer);
      tooltipTimer = null;
      currentTooltipTarget = null;
      tooltipBubble.classList.remove("visible");
      tooltipBubble.style.left = "-9999px";
      tooltipBubble.style.top = "-9999px";
    }

    function setupTooltipEventsForElement(el) {
      el.addEventListener("mouseenter", () => {
        clearTimeout(tooltipTimer);
        currentTooltipTarget = el;
        tooltipTimer = window.setTimeout(() => {
          if (currentTooltipTarget === el) {
            showTooltip(el);
          }
        }, 2000);
      });

      el.addEventListener("mouseleave", hideTooltip);
      el.addEventListener("mousedown", hideTooltip);
      el.addEventListener("focus", () => {
        clearTimeout(tooltipTimer);
        currentTooltipTarget = el;
        tooltipTimer = window.setTimeout(() => {
          if (currentTooltipTarget === el) {
            showTooltip(el);
          }
        }, 2000);
      });
      el.addEventListener("blur", hideTooltip);
    }

    function wireDelayedTooltips(root = document) {
      const tooltipTargets = root.querySelectorAll("[data-tooltip]");
      tooltipTargets.forEach((el) => {
        if (el.dataset.tooltipBound === "true") return;
        el.dataset.tooltipBound = "true";
        setupTooltipEventsForElement(el);
      });
    }

    function applyDemandModeToInterface() {
      updateSessionLabel();
      syncModeInputs();
      if (latestResults) {
        renderResults(latestResults);
      }
    }

    settingsButton.onclick = (event) => {
      event.stopPropagation();
      syncModeInputs();
      settingsPanel.classList.toggle("hidden");
    };

    settingsPanel.onclick = (event) => {
      event.stopPropagation();
    };

    document.addEventListener("click", () => {
      settingsPanel.classList.add("hidden");
      hideTooltip();
    });

    modeInputs.forEach((input) => {
      input.addEventListener("change", (event) => {
        event.stopPropagation();
        if (!input.checked) return;

        currentDemandMode = input.value;
        syncModeInputs();

        parent.postMessage(
          {
            pluginMessage: {
              type: "set-demand-mode",
              mode: input.value,
              sessionId,
              userId,
              condition,
              reason: "manual_settings_toggle",
            },
          },
          "*"
        );
      });
    });

    resetDismissedBtn.onclick = (event) => {
      event.stopPropagation();

      parent.postMessage(
        {
          pluginMessage: {
            type: "reset-dismissed-issues",
            sessionId,
            userId,
            condition,
          },
        },
        "*"
      );
    };

    checkBtn.onclick = () => {
      if (isLoading) return;

      errorEl.textContent = "";
      statusEl.textContent = "Running GPT accessibility check...";
      setLoading(true);

      postLogEvent({
        eventType: "run_check_click",
        demandMode: currentDemandMode,
        timestamp: new Date().toISOString(),
      });

      parent.postMessage(
        {
          pluginMessage: {
            type: "run-gpt-check",
            sessionId,
            userId,
            condition,
          },
        },
        "*"
      );
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "demand-mode") {
        currentDemandMode = msg.payload.mode;
        syncModeInputs();
        applyDemandModeToInterface();
      }

      if (msg.type === "user-id") {
        userId = msg.payload.userId || "unknown-user";
        updateSessionLabel();

        if (!sessionStarted) {
          sessionStarted = true;

          postLogEvent({
            eventType: "session_start",
            demandMode: currentDemandMode,
            timestamp: new Date().toISOString(),
          });
        }
      }

      if (msg.type === "selection-data") {
        const data = msg.payload;
        latestSelectionData = data;
        selectionSummary.textContent =
          `Selected top-level nodes: ${data.selectionCount}. Extracted nodes: ${data.nodes.length}.`;
        selectionData.textContent = JSON.stringify(data, null, 2);
      }

      if (msg.type === "status") {
        statusEl.textContent = msg.payload.message || "";
      }

      if (msg.type === "check-results") {
        setLoading(false);
        statusEl.textContent = "Check complete.";
        errorEl.textContent = "";
        renderResults(msg.payload);
      }

      if (msg.type === "check-error") {
        setLoading(false);
        statusEl.textContent = "";
        errorEl.textContent = msg.payload.message || "Unknown error";
      }

      if (msg.type === "issue-dismissed") {
        const { issueType, nodeId } = msg.payload;

        if (latestResults && Array.isArray(latestResults.issues)) {
          latestResults.issues = latestResults.issues.filter((issue) => {
            return !(issue.issue_type === issueType && issue.node_id === nodeId);
          });
          renderResults(latestResults);
        }

        statusEl.textContent = "Issue marked resolved for this file until that element changes.";
      }

      if (msg.type === "dismissed-issues-reset") {
        statusEl.textContent = "Dismissed issues reset for this file.";
      }
    };

    wireDelayedTooltips(document);
    updateSessionLabel();
    syncModeInputs();
  </script>
</body>

</html>
