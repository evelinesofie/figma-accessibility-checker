<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>AccessibilityCheck</title>
  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
      color: #222;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      border: 1px solid #ccc;
      background: white;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
    }

    button:hover {
      background: #f5f5f5;
    }

    .icon-button {
      padding: 6px 8px;
      line-height: 1;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .panel {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    .issue {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }

    .muted {
      color: #666;
    }

    .severity {
      display: inline-block;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #ddd;
      margin-top: 4px;
    }

    .status {
      margin-top: 8px;
      color: #444;
    }

    .error {
      color: #b00020;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    .issue-actions {
      margin-top: 10px;
    }

    .issue-details {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .settings-panel {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .settings-option {
      display: block;
      margin-top: 8px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafafa;
      border: 1px solid #eee;
      padding: 8px;
      border-radius: 6px;
      max-height: 180px;
      overflow: auto;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>AI Accessibility Checker</h1>
    <button id="settings-button" class="icon-button" title="Settings">⚙️</button>
  </div>

  <div id="settings-panel" class="settings-panel hidden">
    <div><strong>Explanation mode</strong></div>
    <label class="settings-option">
      <input type="radio" name="demand-mode" value="always" />
      Always
    </label>
    <label class="settings-option">
      <input type="radio" name="demand-mode" value="on_demand" />
      On-demand
    </label>
  </div>

  <div class="row">
    <button id="checkBtn">Check for Issues</button>
    <button id="closeBtn">Close</button>
  </div>

  <div id="status" class="status muted"></div>
  <div id="error" class="error"></div>

  <div class="panel">
    <strong>Session</strong>
    <div id="sessionId" class="muted"></div>
  </div>

  <div class="panel">
    <strong>Selection Summary</strong>
    <div id="selectionSummary" class="muted">No selection loaded yet.</div>
  </div>

  <div class="panel">
    <strong>Extracted Data</strong>
    <pre id="selectionData">Waiting for data...</pre>
  </div>

  <div class="panel">
    <strong>Check Results</strong>
    <div id="results" class="muted">No checks run yet.</div>
  </div>

  <script>
    let sessionStarted = false;
    const condition = Math.random() < 0.5 ? "on_demand" : "always_visible";

    const selectionSummary = document.getElementById("selectionSummary");
    const selectionData = document.getElementById("selectionData");
    const results = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const sessionIdEl = document.getElementById("sessionId");
    const checkBtn = document.getElementById("checkBtn");
    const closeBtn = document.getElementById("closeBtn");
    const settingsButton = document.getElementById("settings-button");
    const settingsPanel = document.getElementById("settings-panel");
    const modeInputs = document.querySelectorAll('input[name="demand-mode"]');

    function createId(prefix) {
      return (
        prefix +
        "-" +
        Date.now() +
        "-" +
        Math.floor(Math.random() * 1000000)
      );
    }

    let userId = "loading-user";
    const sessionId = createId("session");
    let latestResults = null;
    let isLoading = false;
    let currentDemandMode = "on_demand";

    function updateSessionLabel() {
      sessionIdEl.textContent =
        `User: ${userId} | Session: ${sessionId} | Condition: ${condition} | Mode: ${currentDemandMode}`;
    }

    function postLogEvent(event) {
      parent.postMessage(
        {
          pluginMessage: {
            type: "log-event",
            sessionId,
            userId,
            condition,
            event,
          },
        },
        "*"
      );
    }

    function setLoading(loading) {
      isLoading = loading;

      if (loading) {
        checkBtn.disabled = true;
        checkBtn.innerHTML = `<span class="spinner"></span>Checking...`;
      } else {
        checkBtn.disabled = false;
        checkBtn.innerHTML = "Check for Issues";
      }
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderResults(payload) {
      if (!payload) return;

      latestResults = payload;

      const issues = payload.issues || [];
      const summary = payload.summary || {};
      const overall = payload.overall_assessment || "";

      if (!issues.length) {
        results.innerHTML = `
          <div>No issues returned.</div>
          <div class="muted">${escapeHtml(overall)}</div>
        `;
        return;
      }

      results.innerHTML = `
        <div class="muted">
          Total nodes: ${summary.total_nodes ?? "?"}<br>
          Text nodes: ${summary.text_nodes ?? "?"}<br>
          Issues found: ${issues.length}
        </div>
        ${overall ? `<p><strong>Overall:</strong> ${escapeHtml(overall)}</p>` : ""}
        ${issues.map((issue, index) => `
          <div class="issue" data-issue-index="${index}">
            <strong>${escapeHtml(issue.title || "Untitled issue")}</strong><br>
            <span class="muted">Node: ${escapeHtml(issue.node_name || "Unknown")}</span><br>
            <span class="severity">${escapeHtml(issue.severity || "unknown")}</span>

            ${currentDemandMode === "on_demand" ? `
              <div class="issue-actions">
                <button class="toggle-explanation-btn" data-issue-index="${index}">
                  Show Explanation
                </button>
              </div>
            ` : ""}

            <div class="issue-details ${currentDemandMode === "always" ? "" : "hidden"}" id="issue-details-${index}">
              <p>${escapeHtml(issue.explanation || "")}</p>
              <p><strong>Why it matters:</strong> ${escapeHtml(issue.why_it_matters || "")}</p>
              <p><strong>Suggestion:</strong> ${escapeHtml(issue.suggestion || "")}</p>
            </div>
          </div>
        `).join("")}
      `;

      if (currentDemandMode === "on_demand") {
        attachExplanationHandlers();
      }
    }

    function attachExplanationHandlers() {
      const buttons = document.querySelectorAll(".toggle-explanation-btn");

      buttons.forEach((button) => {
        button.onclick = () => {
          const issueIndex = Number(button.dataset.issueIndex);
          const details = document.getElementById(`issue-details-${issueIndex}`);
          if (!details) return;

          const issue = latestResults?.issues?.[issueIndex];
          const isHidden = details.classList.contains("hidden");

          if (isHidden) {
            details.classList.remove("hidden");
            button.textContent = "Hide Explanation";

            postLogEvent({
              eventType: "show_explanation",
              demandMode: currentDemandMode,
              issueIndex,
              issueTitle: issue?.title || "",
              issueNode: issue?.node_name || "",
              severity: issue?.severity || "",
              totalIssues: latestResults?.issues?.length || 0,
              timestamp: new Date().toISOString(),
            });
          } else {
            details.classList.add("hidden");
            button.textContent = "Show Explanation";

            postLogEvent({
              eventType: "hide_explanation",
              demandMode: currentDemandMode,
              issueIndex,
              issueTitle: issue?.title || "",
              issueNode: issue?.node_name || "",
              severity: issue?.severity || "",
              totalIssues: latestResults?.issues?.length || 0,
              timestamp: new Date().toISOString(),
            });
          }
        };
      });
    }

    function applyDemandModeToInterface() {
      updateSessionLabel();
      if (latestResults) {
        renderResults(latestResults);
      }
    }

    settingsButton.onclick = () => {
      settingsPanel.classList.toggle("hidden");
    };

    modeInputs.forEach((input) => {
      input.addEventListener("click", () => {
        console.log("RADIO CHANGED", input.value, input.checked);

        if (!input.checked) return;

        statusEl.textContent = `Sending mode change: ${input.value}`;

        parent.postMessage(
          {
            pluginMessage: {
              type: "set-demand-mode",
              mode: input.value,
              sessionId,
              userId,
              condition,
              reason: "manual_settings_toggle",
            },
          },
          "*"
        );
      });
    });

    checkBtn.onclick = () => {
      if (isLoading) return;

      errorEl.textContent = "";
      statusEl.textContent = "Running GPT accessibility check...";
      setLoading(true);

      postLogEvent({
        eventType: "run_check_click",
        demandMode: currentDemandMode,
        timestamp: new Date().toISOString(),
      });

      parent.postMessage(
        {
          pluginMessage: {
            type: "run-gpt-check",
            sessionId,
            userId,
            condition,
          },
        },
        "*"
      );
    };

    closeBtn.onclick = () => {
      postLogEvent({
        eventType: "session_end",
        demandMode: currentDemandMode,
        timestamp: new Date().toISOString(),
      });

      setTimeout(() => {
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
      }, 100);
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "demand-mode") {
        currentDemandMode = msg.payload.mode;

        modeInputs.forEach((input) => {
          input.checked = input.value === currentDemandMode;
        });

        applyDemandModeToInterface();
      }

      if (msg.type === "user-id") {
        userId = msg.payload.userId || "unknown-user";
        updateSessionLabel();

        if (!sessionStarted) {
          sessionStarted = true;

          postLogEvent({
            eventType: "session_start",
            demandMode: currentDemandMode,
            timestamp: new Date().toISOString(),
          });
        }
      }

      if (msg.type === "selection-data") {
        const data = msg.payload;
        selectionSummary.textContent =
          `Selected top-level nodes: ${data.selectionCount}. Extracted nodes: ${data.nodes.length}.`;
        selectionData.textContent = JSON.stringify(data, null, 2);
      }

      if (msg.type === "status") {
        statusEl.textContent = msg.payload.message || "";
      }

      if (msg.type === "check-results") {
        setLoading(false);
        statusEl.textContent = "Check complete.";
        errorEl.textContent = "";
        renderResults(msg.payload);
      }

      if (msg.type === "check-error") {
        setLoading(false);
        statusEl.textContent = "";
        errorEl.textContent = msg.payload.message || "Unknown error";
      }
    };

    updateSessionLabel();
  </script>
</body>

</html>
