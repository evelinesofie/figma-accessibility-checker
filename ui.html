<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>AccessibilityCheck</title>
  <style>
    :root {
      --accent: #6962e9;
      --accent-soft: #f5f7ff;
      --accent-border: #dfe3ff;
      --accent-text: #3730a3;
      --device-active-bg: #ede9fe;
      --device-active-border: #c4b5fd;
      --device-active-text: #4c1d95;
    }

    body {
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
      color: #222;
      background: #fff;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 12px 0;
      color: #111827;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .device-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      background: #fff;
    }

    .device-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      color: #666;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      line-height: 1;
      position: relative;
      flex-shrink: 0;
    }

    .device-btn:hover {
      background: var(--accent-soft);
      color: var(--accent-text);
    }

    .device-btn.is-active {
      background: var(--device-active-bg);
      border-color: var(--device-active-border);
      color: var(--device-active-text);
    }

    .device-btn:focus-visible,
    button:focus-visible,
    .icon-button:focus-visible,
    .questionmark-btn:focus-visible,
    .adaptivity-toast-ok:focus-visible {
      outline: 2px solid var(--accent-border);
      outline-offset: 2px;
    }

    .settings-anchor {
      position: relative;
    }

    button {
      border: 1px solid #ccc;
      background: white;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: #f5f5f5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #checkBtn {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    #checkBtn:hover {
      filter: brightness(0.97);
    }

    #checkBtn:disabled {
      background: #cbd5e1;
      border-color: #cbd5e1;
      color: #fff;
    }

    .icon-button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: transparent;
      color: #666;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      line-height: 1;
      position: relative;
      flex-shrink: 0;
    }

    .icon-button:hover {
      background: var(--accent-soft);
      color: var(--accent-text);
    }

    .icon-button svg,
    .icon-button span,
    .device-btn svg {
      pointer-events: none;
    }

    .settings-popup {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 230px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
      padding: 10px;
      z-index: 20;
    }

    .settings-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .settings-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 2px;
      cursor: pointer;
    }

    .settings-option input {
      margin: 0;
    }

    .settings-divider {
      height: 1px;
      background: #eee;
      margin: 10px 0;
    }

    .settings-reset-btn {
      width: 100%;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .panel {
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      background: #fff;
    }

    .muted {
      color: #666;
    }

    .status {
      margin-top: 8px;
      color: #374151;
    }

    .error {
      color: #b00020;
      margin-top: 8px;
    }

    .hidden {
      display: none !important;
    }

    .adaptivity-toast {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 9998;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      background: var(--accent-soft);
      color: #1f2937;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    }

    .adaptivity-toast-content {
      min-width: 0;
      flex: 1;
    }

    .adaptivity-toast-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-text);
      margin-bottom: 4px;
    }

    .adaptivity-toast-message {
      font-size: 12px;
      line-height: 1.45;
      color: #374151;
    }

    .adaptivity-toast-actions {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      padding-top: 6px;
    }

    .adaptivity-toast-ok {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      line-height: 1;
      padding: 4px 10px;
      min-width: auto;
      height: 26px;
      border-radius: 8px;
    }

    .adaptivity-toast-ok:hover {
      filter: brightness(0.97);
      background: var(--accent);
    }

    .results-meta {
      margin-bottom: 12px;
    }

    .issue {
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
      background: #fff;
    }

    .issue.issue-expanded {
      border-color: var(--accent-border);
      background: linear-gradient(to bottom, #fff, var(--accent-soft));
    }

    .issue-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px;
      cursor: pointer;
    }

    .issue-header:hover {
      background: #fdfdfdfe;
    }

    .issue-expand-btn {
      margin-top: 0;
      font-size: 14px;
      color: #555;
      margin-left: -4px;
    }

    .issue-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .issue-title {
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .issue-element {
      color: #666;
      font-size: 12px;
      line-height: 1.35;
    }

    .issue-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .issue-chevron {
      width: 14px;
      height: 14px;
      opacity: 0.9;
      transform: rotate(0deg);
      transform-origin: 50% 50%;
      transition: transform 0.18s ease, opacity 0.12s ease;
    }

    .issue-expand-btn:hover .issue-chevron {
      opacity: 1;
    }

    .issue-expand-btn.is-expanded .issue-chevron {
      transform: rotate(90deg);
    }

    .severity {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #ddd;
      margin-top: 6px;
      width: fit-content;
      text-transform: capitalize;
    }

    .severity-high {
      border-color: #f0c6c6;
      background: #fff5f5;
      color: #9f2626;
    }

    .severity-medium {
      border-color: #f1dfb4;
      background: #fffaf0;
      color: #8b6500;
    }

    .severity-low {
      border-color: #d8e8d8;
      background: #f5fff5;
      color: #2f6b2f;
    }

    .issue-body {
      border-top: 1px solid #f1f1f1;
      padding: 10px;
      background: #fcfcfc;
    }

    .issue-section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #666;
      margin: 0 0 6px 0;
      line-height: 1.2;
    }

    .fix-box,
    .explanation-box {
      border: 1px solid #ececec;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }

    .fix-box+.explanation-controls,
    .fix-box+.explanation-box,
    .explanation-controls+.explanation-box {
      margin-top: 10px;
    }

    .fix-box {
      position: relative;
      border: 1px solid #ececec;
      border-radius: 8px;
      padding: 12px;
      padding-right: 42px;
      background: #fff;
    }

    .fix-overlay-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
    }

    .explanation-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }

    .explanation-toggle-btn {
      padding: 6px 10px;
      font-size: 12px;
    }

    .questionmark-btn {
      width: 22px;
      height: 22px;
      font-size: 13px;
      border: 1px solid #dcdcdc;
      color: #555;
      background: #fff;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .questionmark-btn:hover {
      background: #f7f7f7;
      color: #222;
    }

    .questionmark-btn.attention-nudge {
      animation: pulseNudge 1.1s ease-in-out 2;
      border-color: #c4c4c4;
    }

    @keyframes pulseNudge {
      0% {
        transform: scale(1);
      }

      30% {
        transform: scale(1.18);
      }

      60% {
        transform: scale(0.96);
      }

      100% {
        transform: scale(1);
      }
    }

    .explanation-box p {
      margin: 0 0 8px 0;
      line-height: 1.45;
    }

    .explanation-box p:last-child {
      margin-bottom: 0;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #fafafa;
      border: 1px solid #eee;
      padding: 8px;
      border-radius: 6px;
      max-height: 180px;
      overflow: auto;
    }

    .preview-image {
      width: 100%;
      border: 1px solid #eee;
      border-radius: 8px;
      display: block;
      background: #fafafa;
    }

    .preview-empty {
      color: #666;
      font-size: 12px;
    }

    .tooltip-bubble {
      position: fixed;
      z-index: 9999;
      max-width: 180px;
      background: rgba(34, 34, 34, 0.96);
      color: #fff;
      font-size: 11px;
      line-height: 1.35;
      padding: 6px 8px;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .tooltip-bubble.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1>AI Accessibility Checker</h1>

    <div class="topbar-right">
      <div id="deviceSwitcher" class="device-switcher" aria-label="Device type">
        <button id="deviceDesktopBtn" class="device-btn" type="button" aria-label="Desktop" data-device="desktop"
          data-tooltip="Desktop">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="2"></rect>
            <path d="M8 20h8"></path>
            <path d="M12 16v4"></path>
          </svg>
        </button>

        <button id="deviceTabletBtn" class="device-btn" type="button" aria-label="Tablet" data-device="tablet"
          data-tooltip="Tablet">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="2" width="14" height="20" rx="2"></rect>
            <circle cx="12" cy="18" r="0.8"></circle>
          </svg>
        </button>

        <button id="deviceMobileBtn" class="device-btn" type="button" aria-label="Mobile" data-device="mobile"
          data-tooltip="Mobile">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="7" y="2" width="10" height="20" rx="2"></rect>
            <path d="M11 18h2"></path>
          </svg>
        </button>
      </div>

      <div class="settings-anchor">
        <button id="settings-button" class="icon-button" aria-label="Settings" data-tooltip="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.2.78.31 1.2.31H21a2 2 0 1 1 0 4h-.09c-.42 0-.84.11-1.2.31z">
            </path>
          </svg>
        </button>

        <div id="settings-panel" class="settings-popup hidden">
          <div>
            <div class="settings-title">UI Mode</div>

            <label class="settings-option">
              <input type="radio" name="ui-mode" value="debug" />
              <span>Debug</span>
            </label>

            <label class="settings-option">
              <input type="radio" name="ui-mode" value="real" />
              <span>Real</span>
            </label>

            <div class="settings-divider"></div>
          </div>

          <div id="demandModeSection">
            <div class="settings-title">Explanation Mode</div>

            <label class="settings-option">
              <input type="radio" name="demand-mode" value="on_demand" />
              <span>On-demand</span>
            </label>

            <label class="settings-option">
              <input type="radio" name="demand-mode" value="low_demand" />
              <span>Low-demand</span>
            </label>

            <label class="settings-option">
              <input type="radio" name="demand-mode" value="always_visible" />
              <span>Always-visible</span>
            </label>

            <div id="settingsDivider" class="settings-divider"></div>
          </div>

          <button id="resetDismissedBtn" class="settings-reset-btn" type="button">
            Reset resolved issues
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="adaptivityToast" class="adaptivity-toast hidden" role="alert" aria-live="assertive">
    <div class="adaptivity-toast-content">
      <div class="adaptivity-toast-title">Adaptive mode updated</div>
      <div id="adaptivityToastMessage" class="adaptivity-toast-message"></div>
    </div>

    <div class="adaptivity-toast-actions">
      <button id="adaptivityToastOk" class="adaptivity-toast-ok" type="button">
        OK
      </button>
    </div>
  </div>

  <div class="row">
    <button id="checkBtn">Check for Issues</button>
  </div>

  <div id="status" class="status muted"></div>
  <div id="error" class="error"></div>

  <div id="debugSessionPanel" class="panel">
    <strong>Session</strong>
    <div id="sessionId" class="muted"></div>
  </div>

  <div id="debugSelectionSummaryPanel" class="panel">
    <strong>Selection Summary</strong>
    <div id="selectionSummary" class="muted">No selection loaded yet.</div>
  </div>

  <div id="debugSelectionPreviewPanel" class="panel">
    <strong>Selection Preview</strong>
    <div id="selectionPreviewMeta" class="muted">No selection preview loaded yet.</div>
    <div style="margin-top:8px;">
      <img id="selectionPreviewImage" class="preview-image hidden" alt="Selection preview" />
      <div id="selectionPreviewEmpty" class="preview-empty">No preview available.</div>
    </div>
  </div>

  <div id="debugExtractedDataPanel" class="panel">
    <strong>Extracted Data</strong>
    <pre id="selectionData">Waiting for data...</pre>
  </div>

  <div class="panel">
    <strong>Check Results</strong>
    <div id="results" class="muted">No checks run yet.</div>
  </div>

  <div id="tooltipBubble" class="tooltip-bubble" aria-hidden="true"></div>

  <script>
    let sessionStarted = false;
    let uiReady = false;
    const condition = "ui_mode_prototype";

    let calibrationOpportunities = [];
    let calibrationCompletedCount = 0;
    let calibrationOpens = 0;
    let activeCalibrationOpportunity = null;
    let demandModeAssigned = false;

    const selectionSummary = document.getElementById("selectionSummary");
    const selectionData = document.getElementById("selectionData");
    const selectionPreviewMeta = document.getElementById("selectionPreviewMeta");
    const selectionPreviewImage = document.getElementById("selectionPreviewImage");
    const selectionPreviewEmpty = document.getElementById("selectionPreviewEmpty");
    const results = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const sessionIdEl = document.getElementById("sessionId");
    const checkBtn = document.getElementById("checkBtn");
    const settingsButton = document.getElementById("settings-button");
    const settingsPanel = document.getElementById("settings-panel");
    const resetDismissedBtn = document.getElementById("resetDismissedBtn");
    const modeInputs = document.querySelectorAll('input[name="demand-mode"]');
    const uiModeInputs = document.querySelectorAll('input[name="ui-mode"]');
    const tooltipBubble = document.getElementById("tooltipBubble");
    const demandModeSection = document.getElementById("demandModeSection");
    const settingsDivider = document.getElementById("settingsDivider");
    const debugSessionPanel = document.getElementById("debugSessionPanel");
    const debugSelectionSummaryPanel = document.getElementById("debugSelectionSummaryPanel");
    const debugSelectionPreviewPanel = document.getElementById("debugSelectionPreviewPanel");
    const debugExtractedDataPanel = document.getElementById("debugExtractedDataPanel");
    const adaptivityToast = document.getElementById("adaptivityToast");
    const adaptivityToastMessage = document.getElementById("adaptivityToastMessage");
    const adaptivityToastOk = document.getElementById("adaptivityToastOk");
    const deviceButtons = document.querySelectorAll(".device-btn");

    function createId(prefix) {
      return prefix + "-" + Date.now() + "-" + Math.floor(Math.random() * 1000000);
    }

    let userId = "loading-user";
    const sessionId = createId("session");
    let latestResults = null;
    let latestSelectionData = null;
    let latestSelectionImage = null;
    let isLoading = false;
    let currentDemandMode = "on_demand";
    let currentUiMode = "real";
    let currentDeviceType = "desktop";

    const issueUiState = {};
    let tooltipTimer = null;
    let currentTooltipTarget = null;

    function isDebugMode() {
      return currentUiMode === "debug";
    }

    function isRealMode() {
      return currentUiMode === "real";
    }

    function getIssueKey(issue) {
      return `${issue?.issue_type || "other"}|${issue?.node_id || "unknown-node"}`;
    }

    function ensureIssueState(issue) {
      const key = getIssueKey(issue);
      if (!issueUiState[key]) {
        issueUiState[key] = {
          expanded: false,
          explanationVisible: false,
          visitCount: 0,
          everOpenedExplanation: false,
          nudgeLogged: false,
          isRechecking: false
        };
      }
      return issueUiState[key];
    }

    function updateSessionLabel() {
      sessionIdEl.textContent =
        `User: ${userId} | Session: ${sessionId} | Condition: ${condition} | UI Mode: ${currentUiMode} | Mode: ${currentDemandMode} | Device: ${currentDeviceType}`;
    }

    function syncDeviceButtons() {
      deviceButtons.forEach((button) => {
        const isActive = button.dataset.device === currentDeviceType;
        button.classList.toggle("is-active", isActive);
      });
    }

    function showAdaptivityToast(mode) {
      if (!adaptivityToast || !adaptivityToastMessage) return;

      let message = "";

      if (mode === "always_visible") {
        message =
          "Explanations will now be shown automatically to better match your workflow.";
      } else if (mode === "low_demand") {
        message =
          "Explanations will now stay more minimal, but remain available whenever you need them.";
      } else {
        return;
      }

      adaptivityToastMessage.textContent = message;
      adaptivityToast.classList.remove("hidden");

      logIssueEvent({
        eventType: "adaptivity_toast_shown",
        assignedMode: mode,
        timestamp: new Date().toISOString(),
      });
    }

    function hideAdaptivityToast(reason = "ok_clicked") {
      if (!adaptivityToast || adaptivityToast.classList.contains("hidden")) return;

      adaptivityToast.classList.add("hidden");

      logIssueEvent({
        eventType: "adaptivity_toast_dismissed",
        dismissReason: reason,
        timestamp: new Date().toISOString(),
      });
    }

    function postLogEvent(event) {
      parent.postMessage(
        {
          pluginMessage: {
            type: "log-event",
            sessionId,
            userId,
            condition,
            event,
          },
        },
        "*"
      );
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function createStableHash(value) {
      let hash = 0;
      const input = JSON.stringify(value);

      for (let i = 0; i < input.length; i += 1) {
        hash = (hash << 5) - hash + input.charCodeAt(i);
        hash |= 0;
      }

      return String(hash);
    }

    function createScreenFamilySignatureFromSelectionData(data, deviceType) {
      const nodes = Array.isArray(data?.nodes) ? data.nodes : [];

      const stableNodes = nodes
        .map((node) => ({
          type: node.type,
          name: node.name || "",
          x: typeof node.x === "number" ? Math.round(node.x / 20) : 0,
          y: typeof node.y === "number" ? Math.round(node.y / 20) : 0,
        }))
        .sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));

      const textNodes = nodes.filter((node) => node.type === "TEXT").length;

      return createStableHash({
        deviceType,
        selectionCount: data?.selectionCount ?? 0,
        totalNodes: nodes.length,
        textNodes,
        nodes: stableNodes,
      });
    }

    function getNodeFingerprintFromSelectionData(data, nodeId) {
      const nodes = Array.isArray(data?.nodes) ? data.nodes : [];
      const node = nodes.find((item) => item.id === nodeId);
      return node?.fingerprint || null;
    }


    function syncModeInputs() {
      modeInputs.forEach((input) => {
        input.checked = input.value === currentDemandMode;
        input.disabled = isRealMode();
      });
    }

    function syncUiModeInputs() {
      uiModeInputs.forEach((input) => {
        input.checked = input.value === currentUiMode;
      });
    }

    function applyUiModeVisibility() {
      const showDebugPanels = isDebugMode();

      debugSessionPanel.classList.toggle("hidden", !showDebugPanels);
      debugSelectionSummaryPanel.classList.toggle("hidden", !showDebugPanels);
      debugSelectionPreviewPanel.classList.toggle("hidden", !showDebugPanels);
      debugExtractedDataPanel.classList.toggle("hidden", !showDebugPanels);

      demandModeSection.classList.toggle("hidden", isRealMode());
      settingsDivider.classList.toggle("hidden", isRealMode());

      if (isRealMode()) {
        settingsPanel.classList.add("hidden");
      }
    }

    function setLoading(loading) {
      isLoading = loading;

      if (loading) {
        checkBtn.disabled = true;
        checkBtn.innerHTML = `<span class="spinner"></span>Checking...`;
      } else {
        checkBtn.disabled = false;
        checkBtn.innerHTML = "Check for Issues";
      }
    }

    function severityClass(severity) {
      if (severity === "high") return "severity-high";
      if (severity === "medium") return "severity-medium";
      return "severity-low";
    }

    function renderExplanationContent(issue) {
      return `
      <div class="explanation-box">
        <div class="issue-section-label">Explanation</div>
        <p>${escapeHtml(issue.explanation || "")}</p>
        <p><strong>Why it matters:</strong> ${escapeHtml(issue.why_it_matters || "")}</p>
      </div>
    `;
    }

    function renderExplanationControls(issue, issueIndex, state) {
      if (currentDemandMode === "always_visible") {
        return renderExplanationContent(issue);
      }

      if (currentDemandMode === "on_demand") {
        return `
        <div class="explanation-controls">
          <button
            class="explanation-toggle-btn"
            type="button"
            data-action="toggle-explanation"
            data-issue-index="${issueIndex}">
            ${state.explanationVisible ? "Hide Explanation" : "Show Explanation"}
          </button>
        </div>
        ${state.explanationVisible ? renderExplanationContent(issue) : ""}
      `;
      }

      return state.explanationVisible ? renderExplanationContent(issue) : "";
    }

    adaptivityToastOk.onclick = (event) => {
      event.stopPropagation();
      hideAdaptivityToast("ok_clicked");
    };

    function renderSelectionPreview() {
      const errorText = latestSelectionImage?.error || "";

      if (!latestSelectionImage || !latestSelectionImage.imageBase64) {
        selectionPreviewMeta.textContent = errorText
          ? `Preview export failed: ${errorText}`
          : "No preview available for the current selection.";

        selectionPreviewImage.classList.add("hidden");
        selectionPreviewEmpty.classList.remove("hidden");
        selectionPreviewImage.removeAttribute("src");
        selectionPreviewEmpty.textContent = errorText
          ? "Preview export failed."
          : "No preview available.";
        return;
      }

      selectionPreviewMeta.textContent =
        `Preview ready. Source: ${latestSelectionImage.source || "selection"} | MIME: ${latestSelectionImage.mimeType || "image/png"}`;

      selectionPreviewImage.src = `data:${latestSelectionImage.mimeType || "image/png"};base64,${latestSelectionImage.imageBase64}`;
      selectionPreviewImage.classList.remove("hidden");
      selectionPreviewEmpty.classList.add("hidden");
    }

    function renderResults(payload) {
      if (!payload) return;

      latestResults = payload;

      const issues = payload.issues || [];
      const summary = payload.summary || {};

      if (!issues.length) {
        results.innerHTML = `
          <div>No issues found.</div>
        `;
        return;
      }

      results.innerHTML = `
      <div class="results-meta muted">
        Total nodes: ${summary.total_nodes ?? "?"}<br>
        Text nodes: ${summary.text_nodes ?? "?"}<br>
        Issues found: ${issues.length}
      </div>
      ${issues.map((issue, index) => {
        const state = ensureIssueState(issue);
        const expandedClass = state.expanded ? "issue-expanded" : "";

        return `
          <div class="issue ${expandedClass}" data-issue-index="${index}">
            <div class="issue-header" data-action="toggle-expand" data-issue-index="${index}">
              <button

                type="button"
                data-action="toggle-expand"
                data-issue-index="${index}"
                aria-label="${state.expanded ? "Collapse issue" : "Expand issue"}"
                data-tooltip="${state.expanded ? "Collapse issue" : "Expand issue"}">
                <svg class="issue-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="9 6 15 12 9 18"></polyline>
                </svg>
              </button>

              <div class="issue-title-wrap">
                <div class="issue-title">${escapeHtml(issue.title || "Untitled issue")}</div>
                <div class="issue-element">Element: ${escapeHtml(issue.node_name || "Unknown")}</div>
                <div class="severity ${severityClass(issue.severity)}">${escapeHtml(issue.severity || "unknown")}</div>
              </div>

              <div class="issue-header-actions">
                <button
                  class="icon-button"
                  type="button"
                  data-action="go-to-element"
                  data-issue-index="${index}"
                  aria-label="Go to element"
                  data-tooltip="Go to element">
                  <span aria-hidden="true">↗</span>
                </button>

                <button
                  class="icon-button"
                  type="button"
                  data-action="recheck-issue"
                  data-issue-index="${index}"
                  aria-label="Recheck this issue"
                  data-tooltip="Recheck this issue"
                  ${state.isRechecking ? "disabled" : ""}>
                  <span aria-hidden="true">${state.isRechecking ? "…" : "↻"}</span>
                </button>

                <button
                  class="icon-button"
                  type="button"
                  data-action="resolve-issue"

                </button>
              </div>
            </div>

            ${state.expanded ? `
              <div class="issue-body">
                <div class="fix-box">
                  ${currentDemandMode === "low_demand" ? `
                    <button
                      class="questionmark-btn fix-overlay-btn ${state.visitCount >= 3 && !state.everOpenedExplanation ? "attention-nudge" : ""}"
                      type="button"
                      data-action="toggle-explanation"
                      data-issue-index="${index}"
                      aria-label="Show explanation"
                      data-tooltip="Show explanation">
                      ?
                    </button>
                  ` : ""}

                  <div class="issue-section-label">How To Fix It</div>
                  <div>${escapeHtml(issue.suggestion || "")}</div>

              </div>

          </div>

      }).join("")}
    `;

      attachResultsHandlers();
      wireDelayedTooltips(results);

    function logIssueEvent(base) {
      postLogEvent({
        uiMode: currentUiMode,
        demandMode: currentDemandMode,
        deviceType: currentDeviceType,
        totalIssues: latestResults?.issues?.length || 0,
        timestamp: new Date().toISOString(),
        ...base
      });
    }

    function canCalibrate() {
      return isRealMode() && currentDemandMode === "on_demand" && !demandModeAssigned;
    }

    function finalizeActiveCalibrationOpportunity(reason) {
      if (!activeCalibrationOpportunity) return;
      if (activeCalibrationOpportunity.finalized) return;

      activeCalibrationOpportunity.finalized = true;
      calibrationCompletedCount += 1;

      logIssueEvent({
        eventType: "calibration_opportunity_finalized",
        opportunityIndex: activeCalibrationOpportunity.opportunityIndex,
        issueIndex: activeCalibrationOpportunity.issueIndex,
        issueKey: activeCalibrationOpportunity.issueKey,
        opened: activeCalibrationOpportunity.opened,
        finalizeReason: reason,
        completedCount: calibrationCompletedCount
      });

      activeCalibrationOpportunity = null;
      maybeAssignDemandMode();
    }

    function maybeStartCalibrationOpportunity(issueIndex, issue) {
      if (!canCalibrate()) return;
      if (calibrationCompletedCount >= 5) return;
      if (activeCalibrationOpportunity) return;

      const issueKey = getIssueKey(issue);
      const opportunityIndex = calibrationCompletedCount + 1;

      const opportunity = {
        opportunityIndex,
        issueIndex,
        issueKey,
        opened: false,
        finalized: false
      };

      calibrationOpportunities.push(opportunity);
      activeCalibrationOpportunity = opportunity;

      logIssueEvent({
        eventType: "calibration_opportunity_started",
        opportunityIndex,
        issueIndex,
        issueKey
      });
    }

    function maybeRecordCalibrationOpen(issueIndex, issue) {
      if (!canCalibrate()) return;
      if (!activeCalibrationOpportunity) return;
      if (activeCalibrationOpportunity.finalized) return;

      const issueKey = getIssueKey(issue);

      if (activeCalibrationOpportunity.issueKey !== issueKey) {
        return;
      }

      if (activeCalibrationOpportunity.opened) {
        return;
      }

      activeCalibrationOpportunity.opened = true;
      calibrationOpens += 1;

      logIssueEvent({
        eventType: "calibration_open",
        opportunityIndex: activeCalibrationOpportunity.opportunityIndex,
        issueIndex,
        issueKey,
        totalOpens: calibrationOpens
      });
    }

    function maybeAssignDemandMode() {
      if (demandModeAssigned) return;
      if (!isRealMode()) return;
      if (calibrationCompletedCount < 5) return;

      const rate = calibrationOpens / 5;
      const newMode = rate < 0.5 ? "low_demand" : "always_visible";

      demandModeAssigned = true;
      currentDemandMode = newMode;
      showAdaptivityToast(newMode);

      syncModeInputs();
      applyDemandModeToInterface();

      parent.postMessage(
        {
          pluginMessage: {
            type: "set-demand-mode",
            mode: newMode,
            sessionId,
            userId,
            condition,
            reason: "threshold_rule_adaptation",
            calibrationRate: rate
          },
        },
        "*"
      );

      postLogEvent({
        eventType: "adaptive_mode_assigned",
        assignedMode: newMode,
        calibrationRate: rate,
        completedOpportunities: calibrationCompletedCount,
        opens: calibrationOpens,
        timestamp: new Date().toISOString(),
      });
    }

    function handleToggleExpand(issueIndex) {
      const issue = latestResults?.issues?.[issueIndex];
      if (!issue) return;

      const state = ensureIssueState(issue);
      const wasExpanded = state.expanded;
      state.expanded = !state.expanded;

      const button = results.querySelector(
        `.issue-expand-btn[data-issue-index="${issueIndex}"]`
      );

      if (state.expanded && !wasExpanded) {
        if (activeCalibrationOpportunity) {
          finalizeActiveCalibrationOpportunity("moved_to_another_issue");
        }
        maybeStartCalibrationOpportunity(issueIndex, issue);
      }

      if (!state.expanded && wasExpanded) {
        const issueKey = getIssueKey(issue);
        if (
          activeCalibrationOpportunity &&
          activeCalibrationOpportunity.issueKey === issueKey
        ) {
          finalizeActiveCalibrationOpportunity("collapsed_issue");
        }
      }

      if (button) {
        if (state.expanded) {
          button.classList.add("is-expanded");
        } else {
          button.classList.remove("is-expanded");
        }
      }

      if (state.expanded) {
        state.visitCount += 1;

        logIssueEvent({
          eventType: "issue_card_expanded",
          issueIndex,
          issueTitle: issue.title || "",
          issueNode: issue.node_name || "",
          issueType: issue.issue_type || "",
          nodeId: issue.node_id || "",
          severity: issue.severity || "",
          visitCount: state.visitCount
        });

        if (
          currentDemandMode === "low_demand" &&
          state.visitCount >= 3 &&
          !state.everOpenedExplanation &&
          !state.nudgeLogged
        ) {
          state.nudgeLogged = true;

          logIssueEvent({
            eventType: "low_demand_explanation_nudge_triggered",
            issueIndex,
            issueTitle: issue.title || "",
            issueNode: issue.node_name || "",
            issueType: issue.issue_type || "",
            nodeId: issue.node_id || "",
            severity: issue.severity || "",
            visitCount: state.visitCount
          });
        }
      } else {
        logIssueEvent({
          eventType: "issue_card_collapsed",
          issueIndex,
          issueTitle: issue.title || "",
          issueNode: issue.node_name || "",
          issueType: issue.issue_type || "",
          nodeId: issue.node_id || "",
          severity: issue.severity || "",
          visitCount: state.visitCount
        });
      }

      setTimeout(() => {
        renderResults(latestResults);
      }, 180);
    }

    function handleToggleExplanation(issueIndex) {
      const issue = latestResults?.issues?.[issueIndex];
      if (!issue) return;

      const state = ensureIssueState(issue);
      state.explanationVisible = !state.explanationVisible;

      if (state.explanationVisible) {
        state.everOpenedExplanation = true;
        maybeRecordCalibrationOpen(issueIndex, issue);

        logIssueEvent({
          eventType: "show_explanation",
          issueIndex,
          issueTitle: issue.title || "",
          issueNode: issue.node_name || "",
          issueType: issue.issue_type || "",
          nodeId: issue.node_id || "",
          severity: issue.severity || "",
          visitCount: state.visitCount
        });

        const issueKey = getIssueKey(issue);
        if (
          activeCalibrationOpportunity &&
          activeCalibrationOpportunity.issueKey === issueKey &&
          !activeCalibrationOpportunity.finalized
        ) {
          finalizeActiveCalibrationOpportunity("opened_explanation");
        }
      } else {
        logIssueEvent({
          eventType: "hide_explanation",
          issueIndex,
          issueTitle: issue.title || "",
          issueNode: issue.node_name || "",
          issueType: issue.issue_type || "",
          nodeId: issue.node_id || "",
          severity: issue.severity || "",
          visitCount: state.visitCount
        });
      }

      renderResults(latestResults);
    }

    function handleGoToElement(issueIndex) {
      const issue = latestResults?.issues?.[issueIndex];
      if (!issue?.node_id) return;

      parent.postMessage(
        {
          pluginMessage: {
            type: "select-issue-node",
            nodeId: issue.node_id,
          },
        },
        "*"
      );

      logIssueEvent({
        eventType: "go_to_element_clicked",
        issueIndex,
        issueTitle: issue.title || "",
        issueNode: issue.node_name || "",
        issueType: issue.issue_type || "",
        nodeId: issue.node_id || "",
        severity: issue.severity || ""
      });
    }

    function handleResolveIssue(issueIndex) {
      if (!uiReady || userId === "loading-user") {
        statusEl.textContent = "Please wait a moment and try again.";
        return;
      }

      const issue = latestResults?.issues?.[issueIndex];
      if (!issue) return;

      if (!latestSelectionData) {
        statusEl.textContent = "Selection data is not ready yet.";
        return;
      }

      const nodeFingerprint = getNodeFingerprintFromSelectionData(
        latestSelectionData,
        issue.node_id
      );

      const screenFamilySignature = createScreenFamilySignatureFromSelectionData(
        latestSelectionData,
        currentDeviceType
      );

      parent.postMessage(
        {
          pluginMessage: {
            type: "resolve-issue",
            sessionId,
            userId,
            condition,
            issue: {
              issue_type: issue.issue_type,
              node_id: issue.node_id,
              node_name: issue.node_name,
            },
            nodeFingerprint,
            screenFamilySignature,
          },
        },
        "*"
      );

      logIssueEvent({
        eventType: "issue_marked_resolved_clicked",
        issueIndex,
        issueTitle: issue.title || "",
        issueNode: issue.node_name || "",
        issueType: issue.issue_type || "",
        nodeId: issue.node_id || "",
        severity: issue.severity || "",
        screenFamilySignature,
        hasNodeFingerprint: !!nodeFingerprint,
      });
    }

    function handleRecheckIssue(issueIndex) {
      if (!uiReady || userId === "loading-user") {
        statusEl.textContent = "Please wait a moment and try again.";
        return;
      }

      const issue = latestResults?.issues?.[issueIndex];
      if (!issue) return;

      const state = ensureIssueState(issue);
      if (state.isRechecking) return;

      state.isRechecking = true;
      renderResults(latestResults);

      parent.postMessage(
        {
          pluginMessage: {
            type: "recheck-issue",
            sessionId,
            userId,
            condition,
            issue: {
              issue_type: issue.issue_type,
              node_id: issue.node_id,
              node_name: issue.node_name,
            }
          },
        },
        "*"
      );

      logIssueEvent({
        eventType: "issue_recheck_clicked",
        issueIndex,
        issueTitle: issue.title || "",
        issueNode: issue.node_name || "",
        issueType: issue.issue_type || "",
        nodeId: issue.node_id || "",
        severity: issue.severity || ""
      });
    }

    function upsertIssueInLatestResults(updatedIssue) {
      if (!latestResults || !Array.isArray(latestResults.issues)) return;

      const key = `${updatedIssue.issue_type}|${updatedIssue.node_id}`;
      const existingIndex = latestResults.issues.findIndex((issue) => {
        return `${issue.issue_type}|${issue.node_id}` === key;
      });

      if (existingIndex >= 0) {
        latestResults.issues[existingIndex] = updatedIssue;
      } else {
        latestResults.issues.unshift(updatedIssue);
      }
    }

    function removeIssueFromLatestResults(issueType, nodeId) {
      if (!latestResults || !Array.isArray(latestResults.issues)) return;

      latestResults.issues = latestResults.issues.filter((issue) => {
        return !(issue.issue_type === issueType && issue.node_id === nodeId);
      });
    }

    function clearRecheckingState(issueType, nodeId) {
      const key = `${issueType || "other"}|${nodeId || "unknown-node"}`;
      if (issueUiState[key]) {
        issueUiState[key].isRechecking = false;
      }
    }

    function attachResultsHandlers() {
      const actionButtons = results.querySelectorAll("[data-action]");

      actionButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          const issueIndex = Number(button.dataset.issueIndex);
          const action = button.dataset.action;

          if (action === "toggle-expand") {
            handleToggleExpand(issueIndex);
            return;
          }

          if (action === "toggle-explanation") {
            handleToggleExplanation(issueIndex);
            return;
          }

          if (action === "go-to-element") {
            handleGoToElement(issueIndex);
            return;
          }

          if (action === "resolve-issue") {
            handleResolveIssue(issueIndex);
            return;
          }

          if (action === "recheck-issue") {
            handleRecheckIssue(issueIndex);
          }
        });
      });
    }

    function showTooltip(target) {
      const text = target.dataset.tooltip;
      if (!text) return;

      tooltipBubble.textContent = text;
      tooltipBubble.classList.remove("hidden");

      const rect = target.getBoundingClientRect();
      const bubbleRect = tooltipBubble.getBoundingClientRect();

      let left = rect.left + rect.width / 2 - bubbleRect.width / 2;
      let top = rect.top - bubbleRect.height - 8;

      if (left < 8) {
        left = 8;
      }

      if (left + bubbleRect.width > window.innerWidth - 8) {
        left = window.innerWidth - bubbleRect.width - 8;
      }

      if (top < 8) {
        top = rect.bottom + 8;
      }

      tooltipBubble.style.left = `${left}px`;
      tooltipBubble.style.top = `${top}px`;

      requestAnimationFrame(() => {
        tooltipBubble.classList.add("visible");
      });
    }

    function hideTooltip() {
      clearTimeout(tooltipTimer);
      tooltipTimer = null;
      currentTooltipTarget = null;
      tooltipBubble.classList.remove("visible");
      tooltipBubble.style.left = "-9999px";
      tooltipBubble.style.top = "-9999px";
    }

    function setupTooltipEventsForElement(el) {
      el.addEventListener("mouseenter", () => {
        clearTimeout(tooltipTimer);
        currentTooltipTarget = el;
        tooltipTimer = window.setTimeout(() => {
          if (currentTooltipTarget === el) {
            showTooltip(el);
          }
        }, 1000);
      });

      el.addEventListener("mouseleave", hideTooltip);
      el.addEventListener("mousedown", hideTooltip);
      el.addEventListener("focus", () => {
        clearTimeout(tooltipTimer);
        currentTooltipTarget = el;
        tooltipTimer = window.setTimeout(() => {
          if (currentTooltipTarget === el) {
            showTooltip(el);
          }
        }, 2000);
      });
      el.addEventListener("blur", hideTooltip);
    }

    function wireDelayedTooltips(root = document) {
      const tooltipTargets = root.querySelectorAll("[data-tooltip]");
      tooltipTargets.forEach((el) => {
        if (el.dataset.tooltipBound === "true") return;
        el.dataset.tooltipBound = "true";
        setupTooltipEventsForElement(el);
      });
    }

    function applyDemandModeToInterface() {
      updateSessionLabel();
      syncModeInputs();
      if (latestResults) {
        renderResults(latestResults);
      }
    }

    function applyUiModeToInterface() {
      applyUiModeVisibility();
      updateSessionLabel();
      syncUiModeInputs();
      syncModeInputs();
      syncDeviceButtons();
      renderSelectionPreview();
      if (latestResults) {
        renderResults(latestResults);
      }
    }

    function applyDeviceTypeToInterface() {
      syncDeviceButtons();
      updateSessionLabel();

      if (latestResults) {
        renderResults(latestResults);
      }
    }

    settingsButton.onclick = (event) => {
      event.stopPropagation();
      syncUiModeInputs();
      syncModeInputs();
      settingsPanel.classList.toggle("hidden");
    };

    settingsPanel.onclick = (event) => {
      event.stopPropagation();
    };

    document.addEventListener("click", () => {
      settingsPanel.classList.add("hidden");
      hideTooltip();
    });

    uiModeInputs.forEach((input) => {
      input.addEventListener("change", (event) => {
        event.stopPropagation();
        if (!input.checked) return;

        currentUiMode = input.value;

        parent.postMessage(
          {
            pluginMessage: {
              type: "set-ui-mode",
              mode: input.value,
            },
          },
          "*"
        );
      });
    });

    modeInputs.forEach((input) => {
      input.addEventListener("change", (event) => {
        event.stopPropagation();

        if (isRealMode()) {
          syncModeInputs();
          return;
        }

        if (!input.checked) return;

        currentDemandMode = input.value;
        syncModeInputs();

        parent.postMessage(
          {
            pluginMessage: {
              type: "set-demand-mode",
              mode: input.value,
              sessionId,
              userId,
              condition,
              reason: "manual_settings_toggle",
            },
          },
          "*"
        );
      });
    });

    deviceButtons.forEach((button) => {
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        const newDevice = button.dataset.device;

        if (!newDevice || newDevice === currentDeviceType) {
          return;
        }

        currentDeviceType = newDevice;
        applyDeviceTypeToInterface();

        parent.postMessage(
          {
            pluginMessage: {
              type: "set-device-type",
              deviceType: newDevice,
              sessionId,
              userId,
              condition,
            },
          },
          "*"
        );

        logIssueEvent({
          eventType: "device_type_changed",
          deviceType: newDevice
        });
      });
    });

    resetDismissedBtn.onclick = (event) => {
      event.stopPropagation();

      parent.postMessage(
        {
          pluginMessage: {
            type: "reset-dismissed-issues",
            sessionId,
            userId,
            condition,
          },
        },
        "*"
      );
    };

    checkBtn.onclick = () => {
      if (isLoading) return;
      finalizeActiveCalibrationOpportunity("ran_new_check");

      errorEl.textContent = "";
      statusEl.textContent = "Checking current screen...";
      setLoading(true);

      postLogEvent({
        eventType: "run_check_click",
        uiMode: currentUiMode,
        demandMode: currentDemandMode,
        deviceType: currentDeviceType,
        hasSelectionImage: !!latestSelectionImage?.imageBase64,
        timestamp: new Date().toISOString(),
      });

      parent.postMessage(
        {
          pluginMessage: {
            type: "run-gpt-check",
            sessionId,
            userId,
            condition,
          },
        },
        "*"
      );
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "ui-mode") {
        currentUiMode = msg.payload.mode === "debug" ? "debug" : "real";
        applyUiModeToInterface();
      }

      if (msg.type === "demand-mode") {
        const incomingMode = msg.payload.mode;

        if (
          isRealMode() &&
          demandModeAssigned &&
          currentDemandMode !== "on_demand" &&
          incomingMode === "on_demand"
        ) {
          return;
        }

        currentDemandMode = incomingMode;
        syncModeInputs();
        applyDemandModeToInterface();
      }

      if (msg.type === "device-type") {
        currentDeviceType = msg.payload.deviceType || "desktop";
        applyDeviceTypeToInterface();
      }

      if (msg.type === "user-id") {
        userId = msg.payload.userId || "unknown-user";
        updateSessionLabel();
        uiReady = true;

        if (!sessionStarted) {
          sessionStarted = true;

          postLogEvent({
            eventType: "session_start",
            uiMode: currentUiMode,
            demandMode: currentDemandMode,
            deviceType: currentDeviceType,
            timestamp: new Date().toISOString(),
          });
        }
      }

      if (msg.type === "selection-data") {
        const data = msg.payload;
        latestSelectionData = data;
        selectionSummary.textContent =
          `Selected top-level nodes: ${data.selectionCount}. Extracted nodes: ${data.nodes.length}.`;
        selectionData.textContent = JSON.stringify(data, null, 2);
      }

      if (msg.type === "selection-image") {
        latestSelectionImage = msg.payload || null;
        renderSelectionPreview();
      }

      if (msg.type === "status") {
        statusEl.textContent = msg.payload.message || "";
      }

      if (msg.type === "check-results") {
        setLoading(false);
        statusEl.textContent = "Check complete.";
        errorEl.textContent = "";
        renderResults(msg.payload);
      }

      if (msg.type === "check-error") {
        setLoading(false);
        statusEl.textContent = "";
        errorEl.textContent = msg.payload.message || "Unknown error";
      }

      if (msg.type === "issue-resolved") {
        const { issueType, nodeId } = msg.payload;
        removeIssueFromLatestResults(issueType, nodeId);
        renderResults(latestResults);
        statusEl.textContent = "Element marked resolved. It will stay suppressed until that element changes.";
      }

      if (msg.type === "issue-rechecked") {
        const { issueType, nodeId, issue } = msg.payload;
        clearRecheckingState(issueType, nodeId);

        if (issue) {
          upsertIssueInLatestResults(issue);
          statusEl.textContent = "Issue rechecked and is still present.";
        } else {
          removeIssueFromLatestResults(issueType, nodeId);
          statusEl.textContent = "Issue rechecked and is no longer present.";
        }

        renderResults(latestResults);
      }

      if (msg.type === "dismissed-issues-reset") {
        statusEl.textContent = "Resolved issues reset for this file.";
      }
    };

    wireDelayedTooltips(document);
    updateSessionLabel();
    syncUiModeInputs();
    syncModeInputs();
    syncDeviceButtons();
    applyUiModeToInterface();
  </script>
</body>

</html>
